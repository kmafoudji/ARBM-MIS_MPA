name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances systeme (GDAL/GEOS/PROJ)
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev libproj-dev
      - name: Installer les dependances Python
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Verifier le projet Django (system check)
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-key
          POSTGRES_HOST: localhost
        run: python manage.py check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installer les dependances
        working-directory: frontend
        run: npm install
      - name: Build
        working-directory: frontend
        run: npm run build
